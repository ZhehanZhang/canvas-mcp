# Canvas MCP with automated PennKey + Duo token retrieval.
#
#   mkdir -p secrets && printf '%s' 'your-pennkey' > secrets/pennkey_username \
#     && printf '%s' 'your-password' > secrets/pennkey_password \
#     && openssl rand -hex 32 > secrets/mcp_http_auth_token
#   docker compose -f docker-compose.pennkey.yml up -d --build
#   docker compose -f docker-compose.pennkey.yml logs -f   # approve the Duo Push when it arrives
#
# The token and browser cookies are kept in the canvas-auth volume, so restarts
# reuse them and Duo is only needed again if the token can't be rotated.
services:
  canvas-mcp:
    build:
      context: .
      args:
        WITH_PENNKEY_AUTH: "true"
    command: ["canvas-mcp-server", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8819"]
    ports:
      - "127.0.0.1:8819:8819"
    environment:
      CANVAS_AUTH_MODE: pennkey
      CANVAS_API_URL: https://canvas.upenn.edu/api/v1
      PENNKEY_USERNAME_FILE: /run/secrets/pennkey_username
      PENNKEY_PASSWORD_FILE: /run/secrets/pennkey_password
      MCP_HTTP_AUTH_TOKEN_FILE: /run/secrets/mcp_http_auth_token
      DUO_FACTOR: push
      # Optional: get told when a Duo Push is waiting (Slack/Discord/ntfy URL)
      # AUTH_NOTIFY_WEBHOOK_URL: https://ntfy.sh/your-private-topic
    secrets:
      - pennkey_username
      - pennkey_password
      - mcp_http_auth_token
    volumes:
      - canvas-auth:/data
    restart: unless-stopped

secrets:
  pennkey_username:
    file: ./secrets/pennkey_username
  pennkey_password:
    file: ./secrets/pennkey_password
  mcp_http_auth_token:
    file: ./secrets/mcp_http_auth_token

volumes:
  canvas-auth:
